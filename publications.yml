# Publication data for research.qmd
# Each entry is rendered by R/pub_helpers.R. Up to three buttons appear per
# entry, each only if there's something to show:
#   Abstract  from the `abstract` field
#   Links     a toggle box built from the `data` field (as "Replication
#             Data", always listed first) plus the `links` list (PDF,
#             code, OSF, pre-registration, ...)
#   Metrics   a toggle box with an Altmetric badge, a Dimensions
#             citation badge, and a Google Scholar link - shown
#             automatically whenever a DOI is available (see `doi`)
#
# Fields:
#   id        unique string, used to build toggle boxes' HTML ids
#   year      integer, used for sorting (reverse chronological). For an
#             online-first piece, set this to its expected/eventual year
#             (used only for sorting once online_first is no longer set).
#   online_first  optional; set to true while a piece has been published
#             ahead of its volume/issue assignment. Shows "Online First"
#             in place of the year in the citation, and the entry is
#             always sorted above all dated entries regardless of `year`.
#             Remove this field (or set to false) once the piece gets its
#             final volume/issue/pages - it'll then sort normally by year.
#   type      article | under_review | working_paper
#   categories  list of topic tags, e.g.:
#               categories:
#                 - Populism & Elections
#                 - Research Methods
#             These drive the topic filter pills above the article list on
#             research.qmd (render_category_filter() builds the pill list
#             from whatever categories show up across all entries, so
#             adding a new one here is enough to make it filterable - no
#             other file needs updating). Use existing category names
#             where they fit so the filter list doesn't fragment; current
#             set: American Politics, Political Behavior, Political
#             Psychology, Public Opinion, Populism, Race & Ethnicity,
#             Comparative & International Politics, Political
#             Communication, Environmental Politics, Experiment, Research
#             Methods, Discipline & Profession.
#   authors   markdown; bold your own name with **...**
#   title     plain text (markdown ok); becomes the link text when `url`
#             (or, failing that, `pdf`) is set
#   venue     markdown; italicize the journal with *...*
#   url       DOI / journal link (omit for unpublished work)
#   doi       bare DOI (e.g. 10.1234/abcd), used for the Altmetric and
#             Dimensions badges. Only needed if `url` isn't itself a
#             doi.org link (in which case doi is inferred from url).
#   abstract  omit the key entirely if you don't have one yet
#   pdf       path to a locally-hosted PDF -> "PDF" entry inside the Links
#             box (always sorts first, same as a `links:` PDF entry - see
#             below). Meant for working papers/manuscripts that don't have
#             a publisher-hosted version yet: drop the file in
#             files/papers/ (create the folder if it doesn't exist yet)
#             and point here, e.g.:
#               pdf: files/papers/m3.pdf
#             Published articles should keep using a `links:` entry
#             labeled PDF pointing at the publisher's copy instead (see
#             existing `articles:` entries below) - don't set both `pdf`
#             and a `links:` PDF entry on the same one.
#   data      replication data/materials link -> "Replication Data" entry
#             inside the Links box
#   links     list of { label, url, icon } -> "Links" toggle box, e.g.:
#               links:
#                 - label: Code
#                   url: https://github.com/you/repo
#                   icon: bi bi-github
#                 - label: OSF
#                   url: https://osf.io/xxxxx
#                   icon: bi bi-archive
#                 - label: Pre-Registration
#                   url: https://osf.io/xxxxx/registrations
#                   icon: bi bi-clipboard-check
#             (icon is optional; any Bootstrap Icons "bi bi-*" or
#             Academicons "ai ai-*" class works. Defaults to a plain
#             link icon if omitted.)
#   scholar   optional override for the Google Scholar badge (a specific
#             cluster URL) instead of the default title-search link

