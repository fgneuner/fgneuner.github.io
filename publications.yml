    authors: |-
      **Neuner, F.G.**
    title: |-
      Can (Thin) Populism be Manipulated without Manipulating Host Ideology? Evidence from a Conjoint Validation Approach
    venue: |-
      *Journal of Experimental Political Science*.
    url: https://doi.org/10.1017/XPS.2025.10018
    data: https://doi.org/10.7910/DVN/JIUPOU
    links:
      - label: PDF
        url: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/S2052263025100183
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://static.cambridge.org/content/id/urn:cambridge.org:id:article:S2052263025100183/resource/name/S2052263025100183sup001.pdf
        icon: bi bi-file-earmark-text
      - label: Study Materials (OSF)
        url: https://doi.org/10.17605/OSF.IO/NUAVW
        icon: bi bi-archive
      - label: Pre-Registration (US)
        url: https://doi.org/10.17605/OSF.IO/ZMUHQ
        icon: bi bi-clipboard-check
      - label: Pre-Registration (UK)
        url: https://doi.org/10.17605/OSF.IO/RCDTX
        icon: bi bi-clipboard-check
    abstract: |-
      Scholars increasingly conceptualize populism through "thin" ideology — people-centric and anti-elite appeals — which politicians pair with "host" ideologies like nativism or socialism. This study validates whether populism treatments in conjoint experiments successfully manipulate thin ideology without also affecting host ideology perceptions. The research conducted three conjoint validation experiments in the United States and United Kingdom. Results show that thin ideology treatments effectively manipulate underlying concepts, but some operationalizations also influence host ideology perceptions. Specifically, treatments explicitly invoking "American people" or "British people" increased perceptions of conservatism and anti-immigration stance, while generic "the people" appeals did not. The "corrupt elite" treatment most effectively moved anti-elitism perceptions without substantially affecting host ideology. When explicit partisan information was provided, some effects on host ideology diminished. These findings highlight the importance of validating conjoint treatments and the difficulty of isolating thin ideology from host ideology in experimental designs.

  - id: p16
    year: 2026
    type: article
    categories:
      - Populism
      - Political Behavior
      - Comparative & International Politics
      - Experiment
    authors: |-
      **Neuner, F.G.**, Zhirkov, K., Castanho Silva, B., and Wratil, C.
    title: |-
      Comparing Revealed and Expressed Populism: The Case of Voting for the 'Alternative für Deutschland' and 'Die Linke'
    venue: |-
      *German Politics*. 35(2), 205–227.
    url: https://www.tandfonline.com/doi/full/10.1080/09644008.2025.2483225
    doi: 10.1080/09644008.2025.2483225
    data: https://doi.org/10.7910/DVN/IQNJ5M
    links:
      - label: PDF
        url: https://www.tandfonline.com/doi/pdf/10.1080/09644008.2025.2483225
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://www.tandfonline.com/action/downloadSupplement?doi=10.1080%2F09644008.2025.2483225&file=fgrp_a_2483225_sm6522.pdf
        icon: bi bi-file-earmark-text
    abstract: |-
      A growing literature suggests that individuals' populist attitudes are key drivers of voting for both left-wing and right-wing populist parties. However, in contrast to these observational studies, results from recent conjoint experiments suggest that the effect of "thin" populist attitudes (e.g. support for referendums, distrust of elites) is overstated and that populist forces' "host" ideology (e.g. their anti-immigration or anti-globalisation positions) drive support. Turning to the case of Germany, featuring both electorally successful left-wing and right-wing populist parties, we thus reevaluate why voters support these parties. We use a new method that allows us to estimate individual-level, revealed preferences from people's choices in conjoint experiments, which allows us to compare the effects of expressed attitudes measured through standard survey scales to revealed preferences measured from conjoint tasks. Results show that support for the populist Alternative für Deutschland and Die Linke is not driven by voters' revealed thin populist preferences but rather by revealed issue preferences. Both parties primarily benefit from their distinct policy positions rather than their "thin" populist ideology.

  - id: p15
    year: 2025
    type: article
    categories:
      - Political Psychology
      - Race & Ethnicity
      - American Politics
    authors: |-
      Rongbo, J., Klar, S., **Neuner, F.G.**, and Ramirez, M.
    title: |-
      How Cross-Cutting Ties Reduce Affective Polarization: Evidence from Latino Americans
    venue: |-
      *Political Behavior*, 47(4), 1925–1947.
    url: https://link.springer.com/article/10.1007/s11109-025-10019-5
    doi: 10.1007/s11109-025-10019-5
    abstract: |-
      Affective polarization—that is, personal dislike and distrust between Democrats and Republicans—is argued to arise, at least in part, from fewer cross-cutting ties that bridge Democrats and Republicans. We argue that this phenomenon might be specifically relevant to non-Latino white Americans, but less so to Latinos who form a politically diverse group with strong social ties that unite them. Across six years of American National Election Studies data and original survey data from twelve different states across the country, we first show that cross-cutting group memberships predict warmer out-party affect. We then show, across our multiple datasets, that Latinos hold more cross-cutting ties than do non-Latino whites. Further, our data reveal that Latinos consistently hold warmer views of the out-party. Finally, we show with novel survey data that Latinos are especially warm toward out-partisans from within the Latino community. We conclude that affective polarization is less prevalent among Latino Americans who make up the fastest-growing proportion of the American electorate. More broadly, we argue that political behavior among white Americans should not be generalized across ethnic groups without considering unique characteristics of each group.
    data: https://doi.org/10.7910/DVN/CCNJO8
    links:
