        url: https://static-content.springer.com/esm/art%3A10.1007%2Fs11109-025-10019-5/MediaObjects/11109_2025_10019_MOESM2_ESM.pdf
        icon: bi bi-file-earmark-text

  - id: p14
    year: 2023
    type: article
    categories:
      - Political Psychology
      - Experiment
    authors: |-
      **Neuner, F.G.**, and Ramirez, M.D.
    title: |-
      Evaluating the Effect of Descriptive Norms on Tolerance
    venue: |-
      *American Politics Research*, 51(6), 701-714.
    url: https://journals.sagepub.com/doi/full/10.1177/1532673X231168347
    doi: 10.1177/1532673X231168347
    data: https://doi.org/10.7910/DVN/MZIZ6H
    links:
      - label: PDF
        url: https://journals.sagepub.com/doi/pdf/10.1177/1532673X231168347
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://journals.sagepub.com/doi/supp/10.1177/1532673X231168347
        icon: bi bi-file-earmark-text
    abstract: |-
      Recent scholarship has documented changing norms toward political tolerance and an increase in intolerant beliefs in the United States. Descriptive norm theory attributes attitudinal and behavioral changes to beliefs about how we perceive other people think and act. Applied to political tolerance, increasing the perception that society is more or less tolerant should result in corresponding changes among individuals. Neglected from this discussion, however, is the distinction between norms that are applied universally and norms that are applied to specific targets. Four studies show mixed support for descriptive norm theory with norms altering individual tolerance judgments mostly when applied universally. Norms aimed at a particularistic group fail to change tolerance judgments suggesting an important limitation to norm influence. Contrary to expectations, we uncover a reversal effect among Democrats whereby exposure to universalistic norms of intolerance leads to higher levels of tolerance.

  - id: p13
    year: 2023
    type: article
    categories:
      - Populism
      - Political Behavior
      - American Politics
      - Experiment
    authors: |-
      Castanho Silva, B., **Neuner, F.G.**, and Wratil, C.
    title: |-
      Populism and Candidate Support in the US: The Effects of "Thin" and "Host" Ideology
    venue: |-
      *Journal of Experimental Political Science*, 10(3), 438-447.
    url: https://www.cambridge.org/core/journals/journal-of-experimental-political-science/article/populism-and-candidate-support-in-the-us-the-effects-of-thin-and-host-ideology/315C0660F29FBEC870D11DC73E6328D7
    doi: 10.1017/xps.2022.9
    abstract: |-
      Much of the contemporary literature on populism focuses on its status as a "thin" ideology comprising three key components: people-centrism, anti-elitism, and anti-pluralism. Populist politicians pair this "thin" ideology with extreme positions on policy issues such as immigration or taxation (referred to as "host" or "thick" ideologies). A recent study using German samples leveraged conjoint experiments to disentangle the effects of these appeals on vote choice. The results not only showed that extreme host-ideological positions mattered more than so-called "thin" populist appeals, but also that effects of populist appeals were nearly identical among populist and non-populist voters. Our replication in the US context reaffirms both the importance of host-ideological positions and the lack of heterogeneous effects by voters' "thin" populist attitudes. Furthermore, by uncovering some divergence from the German case (e.g. anti-elite appeals trumping people-centric appeals), we highlight the need to experimentally examine the effects of populism's constituent components across contexts.
    data: https://doi.org/10.7910/DVN/5AEGPM
    links:
      - label: PDF
