  - id: p9
    year: 2021
    type: article
    categories:
      - Race & Ethnicity
      - American Politics
      - Public Opinion
      - Experiment
    authors: |-
      Jefferson, H.J., **Neuner, F.G.**, & Pasek, J.
    title: |-
      Seeing Blue in Black and White: Race and Perceptions of Officer-Involved Shootings
    venue: |-
      *Perspectives on Politics*, 19(4), 1165-1183.
    url: https://doi.org/10.1017/S1537592720003618
    data: https://doi.org/10.7910/DVN/FW7M6T
    links:
      - label: PDF
        url: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/S1537592720003618
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://static.cambridge.org/content/id/urn:cambridge.org:id:article:S1537592720003618/resource/name/S1537592720003618sup001.docx
        icon: bi bi-file-earmark-text
    abstract: |-
      Following racially charged events, individuals often diverge in perceptions of what happened and how justice should be served. Examining data gathered shortly after the 2014 shooting of Michael Brown in Ferguson, Missouri alongside reactions to a novel officer-involved shooting, we unpack the processes by which racial divisions emerge. Even in a controlled information environment, white Americans preferred information that supported claims of a justified shooting. Conversely, Black Americans preferred information that implied that the officer behaved inappropriately. These differences stemmed from two distinct processes: we find some evidence for a form of race-based motivated reasoning and strong evidence for belief updating based on racially distinct priors. Differences in summary judgments were larger when individuals identified strongly with their racial group or when expectations about the typical behaviors of Black Americans and police diverged. The findings elucidate processes whereby individuals in different social groups come to accept differing narratives about contentious events.

  - id: p8
    year: 2021
    type: article
    categories:
      - Environmental Politics
      - Political Communication
      - Public Opinion
      - Experiment
    authors: |-
      Meerow, S., and **Neuner, F.G.**
    title: |-
      Positively Resilient? How Framing Local Action Affects Public Opinion
    venue: |-
      *Urban Affairs Review*, 57(1), 70-103.
    url: https://doi.org/10.1177/1078087420905655
    links:
      - label: PDF
        url: https://journals.sagepub.com/doi/pdf/10.1177/1078087420905655
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://journals.sagepub.com/doi/supp/10.1177/1078087420905655
        icon: bi bi-file-earmark-text
    abstract: |-
      Cities face numerous environmental challenges. Local governments need the public's support to tackle these problems, and scholars and practitioners have suggested that framing initiatives around resilience, as opposed to sustainability, reducing vulnerability, or adaptation, may increase public support for local action. Resilience, they argue, has a better social connotation, is more positive, and less polarizing than related concepts. Empirical evidence supporting these claims is lacking. In three online survey experiments, we test whether the public is more likely to support policies when they are framed in terms of "resilience." We also examine public conceptualizations of these different terms and whether resilience has a more positive connotation. We find significant differences in policy support, perceived importance, and interpretations of the concepts. The study confirms that framing affects policy support, but complicates claims that resilience is inherently more appealing. These findings have implications for urban research and policymaking.

  - id: p7
    year: 2021
    type: article
    categories:
      - Discipline & Profession
    authors: |-
      Fairbanks, B., **Neuner, F.G.**, Perera, I., & Slaughter, C.
    title: |-
      Pay to Play? How Reducing APSA Division Fees Increases Graduate Student Participation
    venue: |-
      *PS: Political Science & Politics*, 54(4), 645-650.
    url: https://doi.org/10.1017/S1049096521000408
    data: https://doi.org/10.7910/DVN/X0NO0K
    links:
      - label: PDF
        url: https://www.cambridge.org/core/services/aop-cambridge-core/content/view/S1049096521000408
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://static.cambridge.org/content/id/urn:cambridge.org:id:article:S1049096521000408/resource/name/S1049096521000408sup001.pdf
        icon: bi bi-file-earmark-text
    abstract: |-
      In 2017, the American Political Science Association (APSA) Committee on the Status of Graduate Students in the Profession launched an initiative to lower the cost of Division (i.e., organized section) membership for students to promote graduate students' professional development and to advance Division interests. This article assesses the effect of this intervention on Division membership. Using APSA membership data, we find that almost two thirds of Divisions that charged fees in 2017 reduced or eliminated student fees between 2017 and 2019, nearly halving the average student dues (i.e., from $11.57 in 2017 to $5.84 in 2019). As a result, average student membership increased by more than 300% in Divisions that reduced fees (i.e., from 79.5 in 2017 to 248.7 in 2019), compared to a marginal 30% increase in those that did not reduce fees. These outcomes of the initiative support additional efforts to reduce the costs of APSA participation for graduate students.

  - id: p6
    year: 2020
    type: article
    categories:
      - Public Opinion
      - Political Communication
      - Experiment
    authors: |-
      Valentino, N.A., **Neuner, F.G.**, Kamin, J., and Bailey, M.
    title: |-
      Testing Snowden's Hypothesis: Does Mere Awareness Drive Opposition to Government Surveillance?
    venue: |-
      *Public Opinion Quarterly*, 84(4), 958-985.
    url: https://doi.org/10.1093/poq/nfaa050
    links:
      - label: PDF
        url: https://academic.oup.com/poq/article-pdf/84/4/958/38490614/nfaa050.pdf
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://academic.oup.com/poq/article-lookup/doi/10.1093/poq/nfaa050#supplementary-data
        icon: bi bi-file-earmark-text
    abstract: |-
      This study explores the antecedents of public support for government surveillance of the private electronic communications and internet browsing of American citizens. The National Security Agency whistleblower, Edward Snowden, famously hoped that uncovering surveillance by the state would create awareness of those practices that would be sufficient to induce public opposition. Other theories suggest that support for these policies might be driven by perceptions of terrorist threat or personal risk of surveillance. We suspect, however, that most citizens do not imagine their own privacy rights to be at risk due to government surveillance, but instead believe members of other groups will be targeted. Therefore, we hypothesize that empathy toward vulnerable outgroups should strongly dampen enthusiasm for surveillance, above and beyond awareness and personal concerns and interests. A nationally representative survey finds knowledge about government surveillance to be higher than many presume, but variation in knowledge or personal interests are largely uncorrelated with support. As hypothesized, empathy for outgroups strongly predicts opposition to these policies, above and beyond a host of other factors. Two experiments further corroborate the result: Outgroup empathy, not exposure to information about actual surveillance practices, boosts public opposition.

  - id: p5
    year: 2020
    type: article
    categories:
      - Environmental Politics
      - Comparative & International Politics
      - Public Opinion
      - Experiment
    authors: |-
      **Neuner, F.G.**
    title: |-
      Public Opinion and the Legitimacy of Global Private Environmental Governance
    venue: |-
      *Global Environmental Politics*, 20(1), 60-81.
    url: https://doi.org/10.1162/glep_a_00539
    links:
      - label: PDF
        url: https://www.mitpressjournals.org/doi/pdf/10.1162/glep_a_00539
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://direct.mit.edu/glep/article/20/1/60/14976/Public-Opinion-and-the-Legitimacy-of-Global#supplementary-data
        icon: bi bi-file-earmark-text
      - label: Pre-Registration
        url: https://aspredicted.org/blind.php?x=d6jk76
        icon: bi bi-clipboard-check
    abstract: |-
      The rise of global private environmental governance has inspired substantial research assessing whether organizations like the International Organization for Standardization (ISO) and the Forest Stewardship Council (FSC) are legitimate. These organizations address global challenges and help overcome collective action problems, but public opposition can severely curb their effectiveness. Yet, we do not know whether the public supports such organizations and perceives them as legitimate. This article draws on diverse political science literatures to outline why a focus on public opinion is important. The article tests two competing arguments explaining potential opposition toward organizations like the ISO and the FSC: accounts centered on the role of sincere preferences over the legitimate locus of authority and on the influence of domestic elite rhetoric. Results suggest that public opinion is generally positive and that elite rhetoric about a potential democratic deficit rather than simple information about the bodies' governance structures decreases favorability.

  - id: p4
    year: 2020
    type: article
    categories:
      - Political Psychology
      - Political Communication
      - Experiment
    authors: |-
      Bachleda, S., **Neuner, F.G.**, Soroka, S., Guggenheim, L., Fournier, P., & Naurin, E.
    title: |-
      Measuring Negativity Biases in News Selection
    venue: |-
      *Personality and Individual Differences*, 155, 109675.
    url: https://doi.org/10.1016/j.paid.2019.109675
    abstract: |-
      Literatures across the social sciences highlight the tendency for humans to be more attentive to negative information than to positive information. We focus here on negativity biases in news selection (NBNS) and suggest that this bias varies across individuals and contexts. We introduce a survey-based measure of NBNS which is used to explore the correlates of negative news bias in surveys in the U.S., Canada, and Sweden. We find that some respondents are more prone to NBNS than others. There is evidence of contextual effects, but panel data suggests that some of the individual-level differences persist over time. NBNS likely reflects some combination of long-term personality differences and short-term situational factors, and is systematically related to a number of economic and political attitudes.

  - id: p3
    year: 2019
    type: article
    categories:
      - Public Opinion
      - Political Communication
    authors: |-
      **Neuner, F.G.**, Soroka, S.N., and Wlezien, C.
    title: |-
      Mass Media as a Source of Public Responsiveness
    venue: |-
      *International Journal of Press/Politics*, 24(3), 269-292.
    url: https://journals.sagepub.com/doi/full/10.1177/1940161219832416
    doi: 10.1177/1940161219832416
    links:
      - label: PDF
        url: https://journals.sagepub.com/doi/pdf/10.1177/1940161219832416
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://journals.sagepub.com/doi/supp/10.1177/1940161219832416
        icon: bi bi-file-earmark-text
    abstract: |-
      A sizable literature finds evidence of public responsiveness to policy change, across a range of salient policy domains and countries. We have a very limited sense for what drives this aggregate-level responsiveness, however. One possibility is that individuals learn at least part of what they need to know from mass media. Work tends to emphasize failures in both media coverage and citizens, but little research explores the prevalence of relevant, accurate information in media content, or citizens' abilities to identify and respond to that information. Using the case of defense spending in the United States, we examine both, through an automated content analysis of thirty-five years of reporting, validated by a coding exercise fielded to survey respondents. Results prompt analyses of the American National Election Study (ANES), tracing both individual-level perceptions of and preferences for defense spending change over time. These results, supplemented by aggregate analyses of the General Social Survey (GSS), illustrate how media might facilitate — but also confuse — public responsiveness.

  - id: p2
    year: 2018
    type: article
