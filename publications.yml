  - id: m5
    type: under_review
    categories:
      - Research Methods
      - Experiment
    authors: |-
      Zhirkov, K., **Neuner, F.G.**, and Scholten, M.
    title: |-
      Marginal Component Effects from Conjoint Experiments as Measures of Preferences: Assessing Predictive Validity at the Individual Level
    abstract: |-
      Marginal component effects (MCEs) are the most common quantities used to present results from conjoint survey experiments, but recent scholarship has questioned their appropriateness as measures of preferences. Much of this debate concerns the accuracy of the signs and magnitudes of MCEs, which is assessed through aggregate-level analyses. In this paper, we explore the predictive validity of MCEs—the degree to which they map onto measures of other relevant concepts—through individual-level analyses. Our evidence comes from three studies, two in the United States and one in Germany, in which respondents both choose between and rate hypothetical candidates in conjoint experiments—and then report their support for existing parties and policies in separate questions. Using these data, we show that respondents’ preferences measured via individual MCEs in conjoint experiments strongly and consistently predict self-reported party support, voting intentions, and issue positions in the expected directions.

  - id: m3
    type: working_paper
    categories:
      - Political Psychology
      - American Politics
    authors: |-
      **Neuner, F.G.**, and Hechter, M.
    title: |-
      Status Reversal and its Discontents
    abstract: |-
      There is a large literature in the social sciences suggesting that individuals who suffer from a reversal of social status experience negative affect and, some aver, intolerant attitudes towards the groups that threaten to replace them in the status hierarchy. Political scientists and sociologists have long attributed right-wing politics to the loss of status among previously advantaged groups. This paper adds an important caveat to this line of research by seeking to identify the causal impact of actual status loss on in-group bias, outgroup discrimination, and potential downstream political attitudes. Crucially, the experiments isolate the effect of status reversal from that of pre-existing beliefs about lower status outgroups. The results suggest that status reversal is a necessary but insufficient condition for the development of intolerant attitudes and behaviors. The sufficient conditions for the development of reactionary politics likely consist of both actual status reversal and pre-existing intergroup stratification.
