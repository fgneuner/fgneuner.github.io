  - id: p11
    year: 2022
    type: article
    categories:
      - Political Psychology
      - Political Behavior
      - American Politics
      - Experiment
    authors: |-
      Kacholia, S., and **Neuner, F.G.**
    title: |-
      The Effect of Priming Partisan Identities on Support for Political Violence
    venue: |-
      *Frontiers in Political Science*, 4, 835032.
    url: https://doi.org/10.3389/fpos.2022.835032
    data: https://doi.org/10.7910/DVN/GXGGGH
    links:
      - label: PDF
        url: https://www.frontiersin.org/journals/political-science/articles/10.3389/fpos.2022.835032/pdf
        icon: bi bi-file-earmark-pdf
      - label: Supplementary Material
        url: https://www.frontiersin.org/articles/10.3389/fpos.2022.835032/full#supplementary-material
        icon: bi bi-file-earmark-text
    abstract: |-
      Individuals in the United States appear increasingly willing to support and justify political violence. This paper therefore examines whether making partisan identities salient increases support for political violence. We embed priming manipulations in a sample of roughly 850 U.S. adults to investigate whether activating positive partisan identity, negative partisan identity, instrumental partisan identity, and American national identity might lead to differences in reported support for political violence. While we uncover no effects of priming various identities on support for political violence, we replicate and extend previous research on its correlates. Specifically, we demonstrate how various measures of partisan identity strength as well as negative personality traits are correlated with acceptance of political violence.

  - id: p10
    year: 2022
    type: article
    categories:
      - Populism
      - Political Behavior
      - Comparative & International Politics
      - Experiment
    authors: |-
      **Neuner, F.G.**, and Wratil, C.
    title: |-
      The Populist Marketplace: Unpacking the Role of "Thin" and "Thick" Ideology
    venue: |-
      *Political Behavior*, 44, 551-574.
    url: https://link.springer.com/article/10.1007/s11109-020-09629-y
    doi: 10.1007/s11109-020-09629-y
    abstract: |-
      A growing body of work adopts a "thin" ideology conception of populism, which attributes populist parties' electoral success to anti-elite and people-centric appeals that resonate with voters holding populist attitudes. A second tradition, however, has attributed the success of populist parties to particular "thick" or "host" ideologies, such as anti-immigration, anti-globalization, or pro-redistribution positions. This creates a need to unpack which exact components of thin and/or thick populist ideology attract voters to these parties. We address this question by leveraging conjoint survey experiments that allow us to causally identify the effects of several thin and thick populist attributes on vote choice. Examining the case of Germany, results from experiments embedded in two high-quality panel surveys demonstrate that populist anti-immigration and pro-redistribution positions as well as people-centric political priorities are the most vote-maximizing components of populist ideology. In contrast, anti-elite priorities as well as Eurosceptic and anti-globalization positions do not boost support, not even among voters with strong populist attitudes. Our findings also call into question conventional wisdom about the interplay between supply and demand-side factors in explaining populist success.
    data: https://doi.org/10.7910/DVN/Z66XXP
    links:
